<div class="not-prose my-6 aspect-video rounded-lg overflow-hidden border border-zinc-200 dark:border-zinc-800">
  <iframe
    src="https://www.youtube-nocookie.com/embed/{{ head .args }}"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen
    class="w-full h-full"
  ></iframe>
</div>
