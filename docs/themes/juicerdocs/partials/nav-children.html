{{ if .pages }}
  <ul class="mt-1 space-y-0.5 border-l jd-border-soft">
    {{ for p <- .pages }}
      <li>
        <a href="{{ p.url }}" data-juicerdocs-nav-link class="jd-nav-link">
          {{ p.title }}
        </a>
      </li>
    {{ end }}
  </ul>
{{ end }}
{{ if .subsections }}
  <ul class="mt-1 space-y-0.5 border-l jd-border-soft">
    {{ for sub <- .subsections }}
      <li>
        <a href="{{ sub.url }}" data-juicerdocs-nav-link class="jd-nav-link" style="font-weight:500">
          {{ sub.title }}
        </a>
        {{ partial 'nav-children' sub }}
      </li>
    {{ end }}
  </ul>
{{ end }}
